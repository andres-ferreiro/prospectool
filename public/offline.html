<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Lead Finder</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #171717; color: #f5f5f5; }
    }
    main {
      max-width: 320px;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 18px; margin: 16px 0 8px; }
    p { font-size: 14px; opacity: 0.7; margin: 0 0 20px; }
    button {
      border: none;
      border-radius: 999px;
      background: #0a84ff;
      color: white;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página. Los resultados que ya visitaste siguen disponibles cuando vuelvas a abrir la app.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
